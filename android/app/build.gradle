plugins { id 'com.android.application' }
def rootManifest = file('../../Cargo.toml').text
def appVersion = (rootManifest =~ /(?m)^version = "([^"]+)"/)[0][1]
def parts = appVersion.tokenize('.').collect { it.toInteger() }
android {
    namespace 'com.keyboardit.controller'
    compileSdk 35
    defaultConfig {
        applicationId 'com.keyboardit.controller'
        minSdk 26
        targetSdk 35
        versionCode parts[0] * 1000000 + parts[1] * 1000 + parts[2]
        versionName appVersion
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('KEYBOARD_IT_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('KEYBOARD_IT_ANDROID_KEYSTORE'))
                storePassword System.getenv('KEYBOARD_IT_ANDROID_STORE_PASSWORD')
                keyAlias 'keyboard-it'
                keyPassword System.getenv('KEYBOARD_IT_ANDROID_KEY_PASSWORD') ?: System.getenv('KEYBOARD_IT_ANDROID_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; if (System.getenv('KEYBOARD_IT_ANDROID_KEYSTORE')) signingConfig signingConfigs.release } }
    lint { abortOnError true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
