[package]
name = "win-receiver"
version.workspace = true
edition = "2021"
description = "keyboard-it receiver — injects encrypted key/mouse events from a Mac into Windows (tray + settings window)"
authors = ["KutayOz"]

[dependencies]
protocol = { path = "../protocol" }
device-host = { path = "../device-host" }
# windows/slint are resolved/compiled ONLY on the Windows target.
# macOS builds ignore this block entirely.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_Threading",
    "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
slint = "1.17"

[build-dependencies]
slint-build = "1.17"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"   # embed the exe icon + version info
