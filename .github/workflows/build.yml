name: build

# Cloud build/packaging: produces the .msi + .dmg without physical Windows/Mac machines.
# - pull_request: compile + test + package on every PR, so a branch is never merged blind
#   (this workflow previously ran only on demand, and PR #1 reached review with no checks)
# - workflow_dispatch: manual trigger (gh workflow run build.yml)
# - tag v*: additionally creates a GitHub Release with the installers attached
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Fast, cheap validation (Linux): compile the whole workspace + run tests.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Virtual X11 input fixture (no physical devices)
        run: sudo apt-get update && sudo apt-get install -y xvfb libxtst6 libx11-6
      - run: cargo test --workspace --locked --verbose
      - name: Native Linux adapter against isolated Xvfb
        run: env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 KEYBOARD_IT_VIRTUAL_DISPLAY=1 xvfb-run -a cargo test -p device-host --test x11_input --locked -- --ignored

  # macOS: release build -> keyboard-it.app -> .dmg (native package.sh).
  macos:
    runs-on: macos-14 # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # dmgbuild is installed by package.sh, which already handles PEP 668
      # ("externally-managed-environment") with a --break-system-packages
      # fallback. A duplicate step here only re-broke when the runner image
      # started enforcing it — one install path, in the script both CI and a
      # local packaging run share.
      - name: Native macOS tests (including VideoToolbox decode)
        run: cargo test --workspace --locked
      - name: Native AppKit viewer smoke check (no windows shown)
        run: cargo run -p mac-sender --locked -- --check-viewer
      - name: Native devices UI with PC and Android fixtures (no device connections)
        run: cargo run -p mac-sender --locked -- --check-devices
      - name: Package .app + .dmg
        run: bash packaging/mac/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  # Windows: build win-receiver FIRST (verifies the Slint/tray code compiles),
  # THEN package the .msi with cargo-wix. WiX v3 ships preinstalled on the windows runner.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native Windows tests (encoder and protocol)
        run: cargo test --workspace --locked
      - name: Build win-receiver (Slint compile check)
        run: cargo build --release -p win-receiver
      - name: Install cargo-wix
        run: cargo install cargo-wix --locked
      # -C/-L pass '-ext WixFirewallExtension' to candle and light respectively; cargo-wix
      # has no --ext of its own. BOTH are required: candle needs the extension to compile
      # the fw:FirewallException element, light to link its custom action and tables.
      # WixFirewallExtension.dll ships with the WiX v3.14 toolset preinstalled on the runner.
      - name: Package .msi
        run: >
          cargo wix --package win-receiver --no-build --nocapture
          -C -ext -C WixFirewallExtension
          -L -ext -L WixFirewallExtension
      # cargo-wix derives the output name from the package name (win-receiver-<version>-x86_64.msi);
      # rename to keyboard-it-<version>-x64.msi so it carries the same product name as the dmg
      # and the site links.
      - name: Rename .msi to product name
        shell: pwsh
        run: Get-Item target/wix/*.msi | Rename-Item -NewName { $_.Name -replace '^win-receiver','keyboard-it' -replace 'x86_64','x64' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: target/wix/*.msi
          if-no-files-found: error

  # Android uses the same protocol crate; the production signing key stays local.
  android:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Android SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Build native Android app and lint
        run: packaging/android/build.sh debug
      - name: Android input and Annex-B parser unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebugAndroidTest --no-daemon
      - name: KVM access for isolated CI emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android JNI, codec, NSD, touch and lifecycle integration
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ANDROID_SERIAL=emulator-5554 packaging/android/test-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      # Test-signed APKs are intentionally excluded from public releases. Run
      # packaging/android/sign-release.py locally, then attach the stable-key APK.

  # Only on v* tags: attach the installers to a Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, macos, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Keep the site's 'releases/latest/download/<fixed-name>' links version-independent:
      # upload fixed-name copies ALONGSIDE the versioned files.
      - name: Prepare installers and SHA-256 checksums
        run: |
          mkdir -p release
          cp artifacts/macos-dmg/keyboard-it-*.dmg release/
          cp artifacts/windows-msi/keyboard-it-*-x64.msi release/
          cp release/keyboard-it-*.dmg release/keyboard-it-macos.dmg
          cp release/keyboard-it-*-x64.msi release/keyboard-it-windows-x64.msi
          cd release
          sha256sum *.dmg *.msi > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
